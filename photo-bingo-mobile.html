<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<title>Photo Bingo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap');

:root {
  --paper: #f6f3ec;
  --ink: #25251f;
  --muted: #77766d;
  --sage: #92976b;
  --sage-dark: #73794e;
  --tile: #eeece4;
  --line: #dedbcf;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--paper);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; }
.page {
  width: min(100%, 680px);
  margin: 0 auto;
  padding: max(22px, env(safe-area-inset-top)) 14px
           max(28px, env(safe-area-inset-bottom));
}
header { text-align: center; padding: 8px 4px 22px; }
.eyebrow {
  color: var(--sage-dark);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2.5px;
}
h1 {
  margin: 8px 0 4px;
  font: 700 clamp(39px, 11vw, 54px)/1.05 'Playfair Display', Georgia, serif;
  letter-spacing: -1.5px;
}
.subtitle { color: var(--muted); font-size: 13px; }
.progress-row {
  display: flex; justify-content: space-between; align-items: center;
  margin: 4px 1px 9px; font-size: 11px; font-weight: 800;
  letter-spacing: .6px;
}
.progress-track {
  height: 7px; border-radius: 99px; overflow: hidden;
  background: #e5e1d7; margin-bottom: 15px;
}
.progress-fill {
  width: 0; height: 100%; background: var(--sage);
  border-radius: inherit; transition: width .25s ease;
}
.board-wrap {
  padding: 6px; background: var(--line); border-radius: 13px;
  box-shadow: 0 3px 12px #3935220d;
}
.grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: clamp(3px, 1.2vw, 7px);
}
.square {
  appearance: none; border: 2px solid transparent; padding: 0;
  position: relative; min-width: 0; aspect-ratio: 1;
  overflow: hidden; border-radius: 7px; background: var(--tile);
  display: grid; place-items: center; cursor: pointer;
  touch-action: manipulation;
}
.square:focus-visible { outline: 3px solid var(--sage-dark); outline-offset: 2px; }
.square:active { transform: scale(.97); }
.square img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover;
}
.prompt {
  display: block; position: relative; z-index: 1;
  padding: 3px; width: 100%; color: #55564b;
  font-size: clamp(8px, 2.55vw, 12px);
  font-weight: 700; line-height: 1.2;
  overflow-wrap: anywhere;
}
.camera {
  position: absolute; z-index: 2; right: 3px; bottom: 3px;
  display: grid; place-items: center; width: 21px; height: 21px;
  border-radius: 50%; background: #ffffffdf; font-size: 12px;
}
.square.completed .prompt, .square.completed .camera { display: none; }
.square.completed::after {
  content: "✓"; position: absolute; z-index: 3; top: 4px; right: 4px;
  display: grid; place-items: center; width: 19px; height: 19px;
  border-radius: 50%; background: var(--sage-dark); color: white;
  font-size: 12px; font-weight: 800;
  box-shadow: 0 1px 5px #0003;
}
#bingoMessage {
  min-height: 25px; margin: 12px 0 2px; text-align: center;
  color: var(--sage-dark); font-size: 16px; font-weight: 800;
}
.actions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 9px;
  margin-top: 13px;
}
.action {
  min-height: 48px; border: 0; border-radius: 999px;
  padding: 12px 10px; font-size: 13px; font-weight: 800;
  cursor: pointer; touch-action: manipulation;
}
.primary { color: white; background: var(--sage); }
.secondary { color: #55564b; background: #e8e5dc; }
.action:active { transform: scale(.98); }
.help {
  margin: 17px auto 0; max-width: 340px; color: #88877e;
  text-align: center; font-size: 11px; line-height: 1.55;
}
input[type=file] { display: none; }
@media (min-width: 600px) {
  .page { padding: 36px 20px 40px; }
  header { padding-bottom: 28px; }
  .board-wrap { padding: 8px; }
  .square { border-radius: 9px; }
}
@media (max-width: 360px) {
  .page { padding-left: 9px; padding-right: 9px; }
  .board-wrap { padding: 4px; }
  .grid { gap: 3px; }
  .prompt { font-size: 8px; }
  .camera { width: 18px; height: 18px; font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<main class="page">
  <header>
    <div class="eyebrow">A LITTLE PHOTO CHALLENGE</div>
    <h1>Photo Bingo.</h1>
    <div class="subtitle">Find it. Snap it. Fill your board.</div>
  </header>

  <section aria-label="Bingo progress">
    <div class="progress-row">
      <span>YOUR PROGRESS</span>
      <span id="count" aria-live="polite">0 / 25</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
  </section>

  <section class="board-wrap" aria-label="Photo bingo board">
    <div class="grid" id="grid"></div>
  </section>

  <div id="bingoMessage" role="status" aria-live="polite"></div>

  <div class="actions">
    <button class="action primary" id="resetButton" type="button">↻ New game</button>
    <button class="action secondary" id="saveButton" type="button">↓ Save board</button>
  </div>

  <p class="help">Tap a square to take a photo or choose one from your library. Complete a row, column or diagonal to get BINGO!</p>

  <input type="file" id="cameraInput" accept="image/*" capture="environment">
  <input type="file" id="uploadInput" accept="image/*">
</main>

<script>
const prompts = [
  "Something blue", "A flower", "Your favourite drink", "Something vintage", "A cute animal",
  "A beautiful shadow", "Something round", "Your shoes", "A delicious meal", "Something tiny",
  "A stranger's style", "Something green", "A reflection", "Your favourite place", "Something unexpected",
  "A beautiful sky", "Something old", "A piece of art", "A funny sign", "Something yellow",
  "A cozy corner", "Something that makes you smile", "A cool texture", "Something in nature", "A little detail"
];

const grid = document.getElementById('grid');
const cameraInput = document.getElementById('cameraInput');
const uploadInput = document.getElementById('uploadInput');
let activeSquare = null;
let photos = {};

function createBoard() {
  grid.innerHTML = '';
  prompts.forEach((prompt, index) => {
    const square = document.createElement('button');
    square.type = 'button';
    square.className = 'square';
    square.setAttribute('aria-label', `${prompt}. Tap to add a photo.`);
    square.innerHTML = `<span class="prompt"></span><span class="camera" aria-hidden="true">📷</span>`;
    square.querySelector('.prompt').textContent = prompt;
    square.addEventListener('click', () => {
      activeSquare = index;
      // On phones, prefer opening the camera; users can use the upload option
      // below by choosing the library picker from the browser if supported.
      cameraInput.click();
    });
    grid.appendChild(square);
  });
  updateProgress();
}

function addPhoto(file) {
  if (!file || activeSquare === null) return;
  if (!file.type.startsWith('image/')) {
    alert('Please choose an image file.');
    return;
  }
  const reader = new FileReader();
  reader.onload = event => {
    photos[activeSquare] = event.target.result;
    const square = grid.children[activeSquare];
    let img = square.querySelector('img');
    if (!img) {
      img = document.createElement('img');
      img.alt = `Photo for ${prompts[activeSquare]}`;
      square.appendChild(img);
    }
    img.src = event.target.result;
    square.classList.add('completed');
    square.setAttribute('aria-label', `${prompts[activeSquare]}. Photo added. Tap to replace.`);
    updateProgress();
    checkBingo();
    activeSquare = null;
  };
  reader.readAsDataURL(file);
}

cameraInput.addEventListener('change', function() {
  addPhoto(this.files[0]);
  this.value = '';
});
uploadInput.addEventListener('change', function() {
  addPhoto(this.files[0]);
  this.value = '';
});

function updateProgress() {
  const total = Object.keys(photos).length;
  document.getElementById('count').textContent = `${total} / 25`;
  document.getElementById('progress').style.width = `${total / 25 * 100}%`;
}

function checkBingo() {
  const completed = new Set(Object.keys(photos).map(Number));
  const lines = [];
  for (let row = 0; row < 5; row++)
    lines.push(Array.from({length: 5}, (_, col) => row * 5 + col));
  for (let col = 0; col < 5; col++)
    lines.push(Array.from({length: 5}, (_, row) => row * 5 + col));
  lines.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
  const won = lines.some(line => line.every(index => completed.has(index)));
  document.getElementById('bingoMessage').textContent =
    won ? '🎉 BINGO! You did it!' : '';
}

function resetBoard() {
  if (!confirm('Start a new game? Your photos will be cleared.')) return;
  photos = {};
  activeSquare = null;
  createBoard();
  document.getElementById('bingoMessage').textContent = '';
}

function saveBoard() {
  // Opens the browser's native screenshot/share workflow on phones.
  alert('To save your board with its photos, take a screenshot of this screen.');
}

document.getElementById('resetButton').addEventListener('click', resetBoard);
document.getElementById('saveButton').addEventListener('click', saveBoard);
createBoard();
</script>
</body>
</html>
